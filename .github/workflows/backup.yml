name: Daily database backup

# Takes a full dump of the hosted Supabase database (all schemas, including accounts) every day, encrypts it, and keeps
# it for 30 days as a private workflow artifact. Free Supabase has no backups of its own. The artifact is encrypted, so
# tenant records are never readable from the repository's artifact list without the passphrase.
# Restore steps are in docs/OPERATIONS.md.

on:
  schedule:
    - cron: '47 15 * * *' # 23:47 Philippine time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, verify and encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Missing SUPABASE_DB_URL repository secret"; exit 1; fi
          umask 077
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --schema=public --schema=auth --schema=private --file=backup.dump
          pg_restore --list backup.dump > /dev/null
          echo "Dump size: $(stat -c %s backup.dump) bytes"

      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "Missing BACKUP_PASSPHRASE repository secret"; exit 1; fi
          stamp=$(TZ=Asia/Manila date +%Y-%m-%d)
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "rentbybob-$stamp.dump.gpg" backup.dump
          rm backup.dump
          echo "BACKUP_FILE=rentbybob-$stamp.dump.gpg" >> "$GITHUB_ENV"

      - name: Keep the encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: rentbybob-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
